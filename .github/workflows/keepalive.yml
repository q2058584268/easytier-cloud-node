name: keepalive

# Render 免费档空闲 15 分钟就休眠，这里每 5 分钟打一次请求保活。
# 仓库是公开的，Actions 不消耗额度。GitHub cron 有时会延迟，偶尔仍可能睡过去。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    steps:
      - name: Hit node
        env:
          NODE_URL: ${{ secrets.NODE_URL }}
        run: |
          if [ -z "$NODE_URL" ]; then
            echo "NODE_URL 未配置，跳过（去 Settings -> Secrets 添加）"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://${NODE_URL}" || echo "000")
          echo "keep-warm -> HTTP ${code}"
